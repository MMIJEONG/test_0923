name: Lab2 CI
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 빌드 타입
        type: choice
        options:
          - Release
          - Debug
        default: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 전체 ECU 빌드 (흐름만)
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/build-all.sh "$BRANCH"
    